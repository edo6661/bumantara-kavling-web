server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets are immutable: their filename changes whenever
    # the content changes, so they can be cached aggressively and forever.
    # `^~` makes this prefix win over the regex block below for everything in
    # /assets/ (otherwise a regex location would take precedence in nginx).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (favicon, robots, etc.) — modest caching.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA shell: never cache the entry HTML so every visit/reload picks up the
    # latest hashed chunk references after a deploy. The fallback to /index.html
    # for client-side routes is served from this block, so the no-cache headers
    # apply to it too.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }
}
